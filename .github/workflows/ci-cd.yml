name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Etapa de build + testes automatizados. Roda em todo push e PR para main.
  # Usa o profile "test" (H2 em memoria) definido em application-test.properties
  # -- nao depende do Oracle da FIAP nem de nenhum segredo.
  # ---------------------------------------------------------------------------
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Run tests (profile test / H2)
        run: ./mvnw -B -ntp test

      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 5

      - name: Package application
        run: ./mvnw -B -ntp package -DskipTests

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*.jar
          retention-days: 5

  # ---------------------------------------------------------------------------
  # Deploy em staging. Ambiente "staging" do GitHub -- secrets/vars proprios
  # (Environment), sem approval obrigatorio. Roda em push na main ou disparo manual
  # (workflow_dispatch) -- nao roda em pull request.
  #
  # Deploy direto do .jar (Azure App Service, stack "Java SE / Embedded Web
  # Server") -- nao usa Azure Container Registry nem imagem Docker: a conta
  # Azure for Students da FIAP nao tem acesso a ACR. O Dockerfile/compose deste
  # repo continuam servindo para rodar o projeto localmente (requisito de
  # containerizacao da atividade), so o deploy no Azure e que e via jar.
  #
  # Autenticacao via OIDC (azure/login), com client-id/tenant-id/subscription-id
  # gerados automaticamente pelo Azure Portal (Deployment Center > GitHub Actions)
  # -- foi o proprio portal que criou o App Registration e a federated credential
  # por baixo dos panos, o que resolveu o erro anterior de OIDC manual
  # ("client-id and tenant-id are supplied"). slot-name e sempre "Production"
  # (o slot padrao de qualquer App Service) porque staging e producao sao dois
  # App Services separados, nao deployment slots dentro de um so.
  # ---------------------------------------------------------------------------
  deploy-staging:
    name: Deploy (staging)
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    environment:
      name: staging
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}
    steps:
      - name: Download jar artifact
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: app-jar

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_0DD5968D44E14E0B912D34A841464B73 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_E0448331709E493C8EF9F8431E831723 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_6D7D0894BFF84784A1BDF2045702730D }}

      - name: Deploy no Azure App Service (staging)
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'gestao-residuos-staging'
          slot-name: 'Production'
          package: app-jar/*.jar

      - name: Smoke test (health check)
        run: |
          curl --fail --retry 10 --retry-delay 10 --retry-connrefused \
            ${{ steps.deploy-to-webapp.outputs.webapp-url }}/actuator/health

  # ---------------------------------------------------------------------------
  # Deploy em producao. Ambiente "production" do GitHub -- configure um
  # required reviewer em Settings > Environments para exigir aprovacao manual
  # antes deste job rodar (o pipeline continua automatico, so pausa por 1
  # aprovacao). So dispara depois que o deploy em staging passou.
  # ---------------------------------------------------------------------------
  deploy-production:
    name: Deploy (production)
    needs: deploy-staging
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    environment:
      name: prod
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}
    steps:
      - name: Download jar artifact
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: app-jar

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_B480F02EFC834B4F9EDAA616FB6BD57D }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_47B9830E8AD247E095BF666B31BB7ABB }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_F7AEA80D886B4DF2B957E754DF453BD9 }}

      - name: Deploy no Azure App Service (producao)
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'gestao-residuos-prod'
          slot-name: 'Production'
          package: app-jar/*.jar

      - name: Smoke test (health check)
        run: |
          curl --fail --retry 10 --retry-delay 10 --retry-connrefused \
            ${{ steps.deploy-to-webapp.outputs.webapp-url }}/actuator/health
