name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: gestaoresiduos

jobs:
  # ---------------------------------------------------------------------------
  # Etapa de build + testes automatizados. Roda em todo push e PR para main.
  # Usa o profile "test" (H2 em memoria) definido em application-test.properties
  # -- nao depende do Oracle da FIAP nem de nenhum segredo.
  # ---------------------------------------------------------------------------
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Run tests (profile test / H2)
        run: ./mvnw -B -ntp test

      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 5

      - name: Package application
        run: ./mvnw -B -ntp package -DskipTests

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*.jar
          retention-days: 5

  # ---------------------------------------------------------------------------
  # Build da imagem Docker e push para o Azure Container Registry.
  # So roda em push na main (nao em PR) -- a imagem e construida uma unica vez
  # e reaproveitada nos dois deploys (staging e producao).
  # ---------------------------------------------------------------------------
  build-and-push-image:
    name: Build & Push Docker image
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      image-tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image tag
        id: meta
        run: echo "tag=${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Login no Azure Container Registry
        run: az acr login --name ${{ vars.ACR_NAME }}

      - name: Build e push da imagem
        run: |
          IMAGE="${{ vars.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}"
          docker build -t "$IMAGE:${{ steps.meta.outputs.tag }}" -t "$IMAGE:latest" .
          docker push "$IMAGE:${{ steps.meta.outputs.tag }}"
          docker push "$IMAGE:latest"

  # ---------------------------------------------------------------------------
  # Deploy em staging. Ambiente "staging" do GitHub -- secrets/vars proprios
  # (Environment), sem approval obrigatorio.
  # ---------------------------------------------------------------------------
  deploy-staging:
    name: Deploy (staging)
    needs: build-and-push-image
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://${{ vars.AZURE_WEBAPP_NAME_STAGING }}.azurewebsites.net
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy no Azure App Service (staging)
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME_STAGING }}
          images: ${{ vars.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ needs.build-and-push-image.outputs.image-tag }}

      - name: Configurar variaveis de ambiente do App Service
        run: |
          az webapp config appsettings set \
            --name ${{ vars.AZURE_WEBAPP_NAME_STAGING }} \
            --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
            --settings \
              SPRING_PROFILES_ACTIVE="staging" \
              JWT_SECRET="${{ secrets.JWT_SECRET }}"
          # Staging roda em H2 em memoria (profile "staging") -- nao precisa de
          # DB_USER/DB_PASS do Oracle. Cada deploy/restart recria o schema do zero
          # rodando as mesmas migrations Flyway que rodam contra o Oracle em producao.

      - name: Smoke test (health check)
        run: |
          curl --fail --retry 10 --retry-delay 10 --retry-connrefused \
            https://${{ vars.AZURE_WEBAPP_NAME_STAGING }}.azurewebsites.net/actuator/health

  # ---------------------------------------------------------------------------
  # Deploy em producao. Ambiente "production" do GitHub -- configure um
  # required reviewer em Settings > Environments para exigir aprovacao manual
  # antes deste job rodar (o pipeline continua automatico, so pausa por 1
  # aprovacao). So dispara depois que o deploy em staging passou.
  # ---------------------------------------------------------------------------
  deploy-production:
    name: Deploy (production)
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://${{ vars.AZURE_WEBAPP_NAME_PROD }}.azurewebsites.net
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy no Azure App Service (producao)
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME_PROD }}
          images: ${{ vars.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ needs.build-and-push-image.outputs.image-tag }}

      - name: Configurar variaveis de ambiente do App Service
        run: |
          az webapp config appsettings set \
            --name ${{ vars.AZURE_WEBAPP_NAME_PROD }} \
            --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
            --settings \
              DB_USER="${{ secrets.DB_USER }}" \
              DB_PASS="${{ secrets.DB_PASS }}" \
              JWT_SECRET="${{ secrets.JWT_SECRET }}" \
              SPRING_PROFILES_ACTIVE="prod"
          # Producao aponta para o Oracle da FIAP (profile "prod", application-prod.properties).

      - name: Smoke test (health check)
        run: |
          curl --fail --retry 10 --retry-delay 10 --retry-connrefused \
            https://${{ vars.AZURE_WEBAPP_NAME_PROD }}.azurewebsites.net/actuator/health
