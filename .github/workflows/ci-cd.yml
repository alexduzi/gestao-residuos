name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Etapa de build + testes automatizados. Roda em todo push e PR para main.
  # Usa o profile "test" (H2 em memoria) definido em application-test.properties
  # -- nao depende do Oracle da FIAP nem de nenhum segredo.
  # ---------------------------------------------------------------------------
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Run tests (profile test / H2)
        run: ./mvnw -B -ntp test

      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 5

      - name: Package application
        run: ./mvnw -B -ntp package -DskipTests

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*.jar
          retention-days: 5

  # ---------------------------------------------------------------------------
  # Deploy em staging. Ambiente "staging" do GitHub -- secrets/vars proprios
  # (Environment), sem approval obrigatorio. Roda em push na main ou disparo manual
  # (workflow_dispatch) -- nao roda em pull request.
  #
  # Deploy direto do .jar (Azure App Service, stack "Java SE / Embedded Web
  # Server") -- nao usa Azure Container Registry nem imagem Docker: a conta
  # Azure for Students da FIAP nao tem acesso a ACR. O Dockerfile/compose deste
  # repo continuam servindo para rodar o projeto localmente (requisito de
  # containerizacao da atividade), so o deploy no Azure e que e via jar.
  #
  # Autenticacao via Publish Profile (secret baixado direto do portal do App
  # Service), nao Service Principal/OIDC -- a conta de estudante normalmente
  # nao tem permissao para criar App Registration no Azure AD. Por isso as
  # variaveis de ambiente do App Service (SPRING_PROFILES_ACTIVE, JWT_SECRET,
  # DB_USER/DB_PASS) precisam ser configuradas manualmente uma vez no portal
  # (Configuration > Application settings) -- o pipeline nao roda `az cli`.
  # ---------------------------------------------------------------------------
  deploy-staging:
    name: Deploy (staging)
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}
    steps:
      - name: Download jar artifact
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: app-jar

      - name: Deploy no Azure App Service (staging)
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME_STAGING }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_STAGING }}
          package: app-jar/*.jar

      - name: Smoke test (health check)
        run: |
          curl --fail --retry 10 --retry-delay 10 --retry-connrefused \
            ${{ steps.deploy-to-webapp.outputs.webapp-url }}/actuator/health

  # ---------------------------------------------------------------------------
  # Deploy em producao. Ambiente "production" do GitHub -- configure um
  # required reviewer em Settings > Environments para exigir aprovacao manual
  # antes deste job rodar (o pipeline continua automatico, so pausa por 1
  # aprovacao). So dispara depois que o deploy em staging passou.
  # ---------------------------------------------------------------------------
  deploy-production:
    name: Deploy (production)
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment:
      name: prod
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}
    steps:
      - name: Download jar artifact
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: app-jar

      - name: Deploy no Azure App Service (producao)
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME_PROD }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_PROD }}
          package: app-jar/*.jar

      - name: Smoke test (health check)
        run: |
          curl --fail --retry 10 --retry-delay 10 --retry-connrefused \
            ${{ steps.deploy-to-webapp.outputs.webapp-url }}/actuator/health
