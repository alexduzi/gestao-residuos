# Staging: H2 em memoria, em modo de compatibilidade Oracle, rodando as MESMAS migrations
# Flyway (db/migration/) que rodam contra o Oracle real em producao. Nao precisa de nenhuma
# credencial externa -- o ambiente e efemero por natureza: cada deploy/restart do App Service
# recria o banco do zero e reaplica V1/V2/V3 (inclusive os dados iniciais e usuarios padrao).
spring.datasource.url=jdbc:h2:mem:stagingdb;MODE=Oracle;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=none

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
