# Profile usado pelos testes BDD/API (Cucumber + RestAssured), ativado por
# CucumberSpringConfiguration. Sobe a API de verdade (porta aleatoria) sobre um H2 em memoria
# em modo de compatibilidade Oracle, rodando as MESMAS migrations de producao
# (db/migration: V1 schema, V2 dados de dominio, V3 usuarios admin/user) mais os dados
# extras que so existem para os testes (db/testdata). Nao depende de Oracle nem de Docker.
spring.datasource.url=jdbc:h2:mem:bdddb;MODE=Oracle;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration,classpath:db/testdata
